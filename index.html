<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supabase Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17211b;
      background: #f3f7f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    h1 { margin: 0 0 8px; }
    p { line-height: 1.5; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .page-header h1 { margin: 0; }
    .page-header a { color: inherit; text-decoration: none; }
    .page-header a:hover { text-decoration: underline; }
    #header-user-name {
      font-size: 2rem;
      width: auto;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: black;
      text-align: right;
      overflow-wrap: anywhere;
    }
    #header-user-name:hover { text-decoration: underline; }

    .card {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #d7e1d9;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 16px #173b2510;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bdcbbf;
      border-radius: 7px;
      font: inherit;
    }

    textarea { min-height: 110px; resize: vertical; }

    button {
      width: auto;
      margin: 10px 8px 0 0;
      border-color: #176b3a;
      background: #176b3a;
      color: white;
      cursor: pointer;
    }

    button.secondary {
      border-color: #bdcbbf;
      background: white;
      color: #17211b;
    }

    button:disabled { cursor: wait; opacity: .6; }

    fieldset { border: 0; padding: 0; margin: 0; }
    .role-options { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 12px 0; }
    .role-options legend { width: 100%; }
    .role-options label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
    .role-options input { width: auto; padding: 0; }
    .auth-modes { display: flex; gap: 8px; }
    .auth-modes button { margin-bottom: 10px; }
    .auth-modes button[aria-pressed="true"] { background: #176b3a; color: white; }
    .account-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .account-row p { margin: 0; }
    .profile { display: none; padding: 12px 0; border-top: 1px solid #e3eae4; }
    .profile.visible { display: block; }
    .profile-heading-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .profile-heading-row h3 { margin: 0; }
    .profile [hidden] { display: none; }
    .profile p { margin: 6px 0; }
    .profile-actions { display: flex; }

    .hint, #status { color: #526257; }
    #status { min-height: 1.5em; }
    #status.error { color: #a52323; }
    #status.success { color: #176b3a; }
    #auth-panel[hidden], #data-panel[hidden] { display: none; }

    .entry {
      padding: 12px 0;
      border-top: 1px solid #e3eae4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .entry[role="link"] { cursor: pointer; }
    .entry[role="link"]:hover, .entry[role="link"]:focus-visible { background: #f7faf7; }

    .entry time {
      display: block;
      margin-bottom: 6px;
      color: #64736a;
      font-size: .85rem;
    }

    .chat-section {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e3eae4;
    }
    .chat-section h4 { margin: 0 0 10px; }
    .chat-thread-options { display: grid; gap: 6px; margin-top: 8px; }
    .chat-thread-option { width: 100%; margin: 0; text-align: left; }
    .chat-thread-option[aria-pressed="true"] { background: #124f2d; }
    .chat-thread-option span { display: block; font-size: .85rem; opacity: .85; }
    .chat-messages {
      max-height: 320px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #d7e1d9;
      border-radius: 8px;
      background: #f7faf7;
    }
    .chat-message {
      padding: 8px 0;
      border-bottom: 1px solid #e3eae4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .chat-message:last-child { border-bottom: 0; }
    .chat-message-header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
    .chat-message-header time { color: #64736a; font-size: .85rem; }
    .chat-message p { margin: 4px 0 0; }
    .chat-form textarea { min-height: 72px; }

    code {
      padding: 2px 5px;
      border-radius: 4px;
      background: #eef3ef;
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <a href="./" aria-label="VIBE Freelance home"><h1>VIBE Freelance</h1></a>
      <button id="header-user-name" class="hint" type="button" aria-controls="profile-panel" aria-expanded="false" hidden></button>
    </header>

    <section id="auth-panel" class="card" aria-labelledby="auth-heading" hidden>
      <h2 id="auth-heading">Sign in</h2>
      <p class="hint">Sign in or create your freelancer market account.</p>
      <form id="auth-form">
        <div class="auth-modes" aria-label="Account access">
          <button id="signin-mode" class="secondary" type="button" aria-pressed="true">Sign in</button>
          <button id="register-mode" class="secondary" type="button" aria-pressed="false">Register</button>
        </div>
        <fieldset id="signup-fields" hidden disabled>
          <legend>Profile</legend>
          <fieldset class="role-options">
            <legend>Join as</legend>
            <label><input type="radio" name="account-type" value="business" checked> Business</label>
            <label><input type="radio" name="account-type" value="freelancer"> Freelancer</label>
          </fieldset>
          <label for="signup-name">Name</label>
          <input id="signup-name" type="text" autocomplete="name" maxlength="100" required>
          <label for="signup-company">Company</label>
          <input id="signup-company" type="text" autocomplete="organization" maxlength="100" required>
        </fieldset>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <button id="auth-submit" type="submit">Sign in</button>
      </form>
    </section>

    <section id="data-panel" class="card" aria-labelledby="data-heading" hidden>
      <section id="profile-panel" class="profile" aria-labelledby="profile-heading">
        <div class="account-row">
          <p id="signed-in-user" class="hint"></p>
          <button id="sign-out-button" class="secondary" type="button">Sign out</button>
        </div>
        <div class="profile-heading-row">
          <h3 id="profile-heading">Profile</h3>
          <div class="profile-actions">
            <button id="profile-edit-button" type="button">Edit</button>
          </div>
        </div>
        <p><strong>Account type:</strong> <span id="profile-account-type"></span></p>
        <form id="profile-form">
          <p id="profile-name-display-row"><strong>Name:</strong> <span id="profile-name-display"></span></p>
          <label id="profile-name-label" for="profile-name" hidden>Name</label>
          <input id="profile-name" type="text" autocomplete="name" maxlength="100" required disabled hidden>
          <p id="profile-company-display-row"><strong>Company:</strong> <span id="profile-company-display"></span></p>
          <label id="profile-company-label" for="profile-company" hidden>Company</label>
          <input id="profile-company" type="text" autocomplete="organization" maxlength="100" required disabled hidden>
        </form>
        <p><strong>Rating:</strong> <span id="profile-display-rating"></span></p>
        <p><strong>VIP:</strong> <span id="profile-display-vip"></span></p>
      </section>
      <section id="create-vibe-section" hidden>
        <h3>Create VIBE</h3>
        <form id="text-form">
          <label for="vibe-categories">Categories</label>
          <select id="vibe-categories" required>
            <option value="" selected disabled>Select a category</option>
            <option value="WEB">WEB</option>
            <option value="Programs">Programs</option>
            <option value="Game">Game</option>
            <option value="Other">Other</option>
          </select>
          <label for="vibe-project">Project</label>
          <input id="vibe-project" type="text" maxlength="200" required>
          <label for="vibe-prompt">Prompt</label>
          <textarea id="vibe-prompt" maxlength="5000" required placeholder="Describe what you need..."></textarea>
          <label for="vibe-other">Other</label>
          <textarea id="vibe-other" maxlength="5000" placeholder="Additional details (optional)..."></textarea>
          <label for="vibe-price">Price ($)</label>
          <input id="vibe-price" type="number" min="0" step="0.01" required>
          <button type="submit">Create VIBE</button>
          <button id="refresh-button" class="secondary" type="button">Read again</button>
        </form>
      </section>
      <div id="vibes-list-panel">
        <div class="account-row">
          <h3>VIBEs</h3>
          <label id="vibe-filter-label" for="vibe-category-filter" hidden>
            Category
            <select id="vibe-category-filter">
              <option value="All" selected>All</option>
              <option value="WEB">WEB</option>
              <option value="Programs">Programs</option>
              <option value="Game">Game</option>
              <option value="Other">Other</option>
            </select>
          </label>
        </div>
        <div id="entries" aria-live="polite"></div>
      </div>
      <section id="vibe-detail" aria-labelledby="vibe-detail-heading" hidden>
        <h3 id="vibe-detail-heading">VIBE</h3>
        <div id="vibe-detail-content"></div>
        <section class="chat-section" aria-labelledby="vibe-chat-heading">
          <h4 id="vibe-chat-heading">Private chat</h4>
          <p id="vibe-chat-description" class="hint"></p>
          <details id="chat-thread-selector" hidden>
            <summary id="chat-thread-summary">Select freelancer conversation</summary>
            <div id="chat-thread-options" class="chat-thread-options"></div>
          </details>
          <div id="vibe-chat-messages" class="chat-messages" aria-live="polite"></div>
          <form id="vibe-chat-form" class="chat-form">
            <fieldset id="vibe-chat-controls" disabled>
              <label for="vibe-chat-input">Message</label>
              <textarea id="vibe-chat-input" maxlength="2000" required placeholder="Write a message..."></textarea>
              <button type="submit">Send message</button>
            </fieldset>
          </form>
        </section>
      </section>
    </section>
    <p id="status" role="status" aria-live="polite"></p>

  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.118.0";

    const supabaseUrl = "https://mbgtgccebyooktzxuviu.supabase.co";
    const supabasePublishableKey = "sb_publishable_-e035fsg3lFIJqUdcZbWSg_OXxAjZyT";
    const authPanel = document.querySelector("#auth-panel");
    const authForm = document.querySelector("#auth-form");
    const dataPanel = document.querySelector("#data-panel");
    const textForm = document.querySelector("#text-form");
    const entries = document.querySelector("#entries");
    const status = document.querySelector("#status");
    const vibeChatMessages = document.querySelector("#vibe-chat-messages");
    const chatThreadSelector = document.querySelector("#chat-thread-selector");
    const chatThreadSummary = document.querySelector("#chat-thread-summary");
    const chatThreadOptions = document.querySelector("#chat-thread-options");
    const chatControls = document.querySelector("#vibe-chat-controls");
    const chatForm = document.querySelector("#vibe-chat-form");
    const detailVibeId = new URLSearchParams(window.location.search).get("vibe");
    let supabase = null;
    let authMode = "signin";
    let currentUser = null;
    let currentProfile = null;
    let profileEditing = false;
    let chatChannel = null;
    let activeChatFreelancerId = null;

    function setStatus(message, kind = "") {
      status.textContent = message;
      status.className = kind;
    }

    function showPanel(panel) {
      authPanel.hidden = panel !== "auth";
      dataPanel.hidden = panel !== "data";
    }

    function reportError(error) {
      setStatus(error?.message || "The request failed. Check the project URL, key, table setup, and RLS policies.", "error");
    }

    function setAuthMode(mode) {
      authMode = mode;
      const registering = mode === "register";
      document.querySelector("#auth-heading").textContent = registering ? "Create account" : "Sign in";
      const signupFields = document.querySelector("#signup-fields");
      signupFields.hidden = !registering;
      signupFields.disabled = !registering;
      document.querySelector("#auth-submit").textContent = registering ? "Register" : "Sign in";
      document.querySelector("#signin-mode").setAttribute("aria-pressed", String(!registering));
      document.querySelector("#register-mode").setAttribute("aria-pressed", String(registering));
      document.querySelector("#password").autocomplete = registering ? "new-password" : "current-password";
    }

    function showProfile(user, profile) {
      currentUser = user;
      const headerUserName = document.querySelector("#header-user-name");
      headerUserName.textContent = profile.full_name || "";
      headerUserName.hidden = !profile.full_name;
      document.querySelector("#profile-account-type").textContent =
        profile.account_type === "freelancer" ? "Freelancer" : "Business";
      document.querySelector("#profile-name").value = profile.full_name || "";
      document.querySelector("#profile-company").value = profile.company || "";
      document.querySelector("#profile-name-display").textContent = profile.full_name || "Not set";
      document.querySelector("#profile-company-display").textContent = profile.company || "Not set";
      document.querySelector("#profile-display-rating").textContent =
        Number.isInteger(profile.rating) && profile.rating >= 1 && profile.rating <= 10 ? `${profile.rating}/10` : "Not rated";
      document.querySelector("#profile-display-vip").textContent = profile.vip_status === true ? "Yes" : "No";
      setProfileEditing(false);
    }

    async function loadProfile(user) {
      const profileFields = "id, account_type, full_name, company, rating, vip_status";
      const { data, error } = await supabase
        .from("profile")
        .select(profileFields)
        .eq("id", user.id)
        .maybeSingle();

      if (error) throw error;
      if (data) return data;

      const metadata = user.user_metadata || {};
      const accountType = ["business", "freelancer"].includes(metadata.account_type)
        ? metadata.account_type
        : "business";
      const { data: createdProfile, error: insertError } = await supabase
        .from("profile")
        .insert({
          id: user.id,
          account_type: accountType,
          full_name: metadata.full_name || "",
          company: metadata.company || ""
        })
        .select(profileFields)
        .single();

      if (!insertError) return createdProfile;

      const { data: existingProfile, error: retryError } = await supabase
        .from("profile")
        .select(profileFields)
        .eq("id", user.id)
        .maybeSingle();

      if (!retryError && existingProfile) return existingProfile;
      throw insertError;
    }

    function setProfileEditing(editing) {
      profileEditing = editing;
      document.querySelector("#profile-name").disabled = !editing;
      document.querySelector("#profile-company").disabled = !editing;
      document.querySelector("#profile-name").hidden = !editing;
      document.querySelector("#profile-company").hidden = !editing;
      document.querySelector("#profile-name-label").hidden = !editing;
      document.querySelector("#profile-company-label").hidden = !editing;
      document.querySelector("#profile-name-display-row").hidden = editing;
      document.querySelector("#profile-company-display-row").hidden = editing;
      const button = document.querySelector("#profile-edit-button");
      button.textContent = editing ? "Save" : "Edit";
    }

    function openVibePage(vibeId) {
      const url = new URL(window.location.href);
      url.searchParams.set("vibe", vibeId);
      window.open(url.href, "_blank", "noopener,noreferrer");
    }

    async function readChatMessages() {
      if (!supabase || !currentUser || !detailVibeId || !activeChatFreelancerId) return;

      const { data, error } = await supabase
        .from("chat_messages")
        .select("id, sender_id, sender_name, body, created_at")
        .eq("vibe_id", detailVibeId)
        .eq("freelancer_id", activeChatFreelancerId)
        .order("created_at", { ascending: true })
        .limit(100);

      if (error) throw error;

      vibeChatMessages.replaceChildren();
      if (!data.length) {
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = currentProfile?.account_type === "freelancer"
          ? "Send a message to start a private conversation with the VIBE owner."
          : "This conversation has no messages yet.";
        vibeChatMessages.append(empty);
        return;
      }

      for (const message of data) {
        const article = document.createElement("article");
        article.className = "chat-message";
        const header = document.createElement("div");
        header.className = "chat-message-header";
        const sender = document.createElement("strong");
        sender.textContent = message.sender_name;
        const time = document.createElement("time");
        time.dateTime = message.created_at;
        time.textContent = new Date(message.created_at).toLocaleString();
        const body = document.createElement("p");
        body.textContent = message.body;
        header.append(sender, time);
        article.append(header, body);
        vibeChatMessages.append(article);
      }
      vibeChatMessages.scrollTop = vibeChatMessages.scrollHeight;
    }

    async function readChatThreads() {
      if (!supabase || !currentUser || !detailVibeId) return;

      const isFreelancer = currentProfile?.account_type === "freelancer";
      const description = document.querySelector("#vibe-chat-description");
      chatThreadSelector.hidden = isFreelancer;
      chatControls.disabled = false;

      if (isFreelancer) {
        activeChatFreelancerId = currentUser.id;
        description.textContent = "Only you and the VIBE owner can see this conversation.";
        chatControls.disabled = false;
        await readChatMessages();
        return;
      }

      description.textContent = "Select a freelancer's private conversation to reply.";
      const { data: threads, error: threadsError } = await supabase
        .from("chat_threads")
        .select("freelancer_id, freelancer_name, freelancer_company, created_at")
        .eq("vibe_id", detailVibeId)
        .order("created_at", { ascending: false });
      if (threadsError) throw threadsError;

      chatThreadOptions.replaceChildren();
      if (!threads.length) {
        chatThreadSummary.textContent = "No freelancer conversations yet";
        activeChatFreelancerId = null;
        chatControls.disabled = true;
        vibeChatMessages.replaceChildren();
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "Freelancer conversations will appear here when started.";
        vibeChatMessages.append(empty);
        return;
      }

      for (const thread of threads) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chat-thread-option";
        button.dataset.freelancerId = thread.freelancer_id;
        button.setAttribute("aria-pressed", String(thread.freelancer_id === activeChatFreelancerId));
        button.append(document.createTextNode(thread.freelancer_name || "Name not set"));
        const company = document.createElement("span");
        company.textContent = thread.freelancer_company || "Company not set";
        button.append(company);
        chatThreadOptions.append(button);
      }

      if (!threads.some((thread) => thread.freelancer_id === activeChatFreelancerId)) {
        activeChatFreelancerId = threads[0].freelancer_id;
      }
      const selectedThread = threads.find((thread) => thread.freelancer_id === activeChatFreelancerId);
      chatThreadSummary.textContent = `${selectedThread.freelancer_name || "Name not set"} — ${selectedThread.freelancer_company || "Company not set"}`;
      for (const button of chatThreadOptions.querySelectorAll(".chat-thread-option")) {
        button.setAttribute("aria-pressed", String(button.dataset.freelancerId === activeChatFreelancerId));
      }
      chatControls.disabled = false;
      await readChatMessages();
    }

    function startChatRealtime() {
      if (!supabase || !currentUser || !detailVibeId || chatChannel) return;

      chatChannel = supabase
        .channel(`vibe-chat-${currentUser.id}-${detailVibeId}`)
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "chat_messages"
        }, (payload) => {
          const message = payload.new;
          if (message.vibe_id !== detailVibeId) return;
          const refresh = async () => {
            if (currentProfile?.account_type === "business") {
              await readChatThreads();
            } else if (message.freelancer_id === currentUser?.id) {
              await readChatMessages();
            }
          };
          refresh().catch(reportError);
        })
        .subscribe((channelStatus) => {
          if (channelStatus === "CHANNEL_ERROR" || channelStatus === "TIMED_OUT") {
            reportError(new Error("Live chat updates could not be connected."));
          }
        });
    }

    async function stopChatRealtime() {
      if (!supabase || !chatChannel) return;
      const channel = chatChannel;
      chatChannel = null;
      await supabase.removeChannel(channel);
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase || !currentUser || !currentProfile) {
        setStatus("Sign in before sending a chat message.", "error");
        return;
      }
      if (currentProfile.account_type === "freelancer") {
        activeChatFreelancerId = currentUser.id;
      }
      if (!activeChatFreelancerId) {
        setStatus("Select a freelancer conversation before replying.", "error");
        return;
      }

      const input = document.querySelector("#vibe-chat-input");
      const body = input.value.trim();
      if (!body) return;

      const button = chatForm.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        if (currentProfile.account_type === "freelancer") {
          const { error: threadError } = await supabase
            .from("chat_threads")
            .insert({
              vibe_id: detailVibeId,
              freelancer_id: currentUser.id,
              freelancer_name: currentProfile.full_name || "",
              freelancer_company: currentProfile.company || ""
            });
          if (threadError && threadError.code !== "23505") throw threadError;
        }

        const { error } = await supabase
          .from("chat_messages")
          .insert({
            vibe_id: detailVibeId,
            freelancer_id: activeChatFreelancerId,
            sender_id: currentUser.id,
            sender_name: (currentProfile.full_name || "User").slice(0, 100),
            body
          });
        if (error) throw error;

        input.value = "";
        await readChatThreads();
      } catch (error) {
        reportError(error);
      } finally {
        button.disabled = false;
      }
    });

    async function readVibeDetail() {
      if (!supabase || !detailVibeId) return false;
      const { data, error } = await supabase
        .from("vibes")
        .select("id, content, project, prompt, categories, price, other, author_name, author_company, created_at")
        .eq("id", detailVibeId)
        .maybeSingle();

      if (error) throw error;

      const detail = document.querySelector("#vibe-detail-content");
      detail.replaceChildren();
      if (!data) {
        setStatus("This VIBE could not be found or you do not have access.", "error");
        return false;
      }

      const article = document.createElement("article");
      article.className = "entry";
      const fields = [
        ["Categories", data.categories],
        ["Project", data.project || "Not set"],
        ["Prompt", data.prompt || data.content],
        ["Price", `$${Number(data.price).toFixed(2)}`],
        ["Other", data.other]
      ];
      if (currentProfile?.account_type === "freelancer") {
        fields.splice(1, 0, ["Name", data.author_name || "Not set"], ["Company", data.author_company || "Not set"]);
      }
      for (const [label, value] of fields) {
        if (label === "Other" && !value) continue;
        const paragraph = document.createElement("p");
        paragraph.textContent = `${label}: ${value}`;
        article.append(paragraph);
      }

      const time = document.createElement("time");
      time.dateTime = data.created_at;
      time.textContent = new Date(data.created_at).toLocaleString();
      article.append(time);
      detail.append(article);
      return true;
    }

    async function readTexts() {
      if (!supabase) return;
      const categoryFilter = document.querySelector("#vibe-category-filter").value;
      let query = supabase
        .from("vibes")
        .select("id, content, project, prompt, categories, price, other, author_name, author_company, created_at");
      if (currentProfile?.account_type === "freelancer" && categoryFilter !== "All") {
        query = query.eq("categories", categoryFilter);
      }
      const { data, error } = await query
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) throw error;

      entries.replaceChildren();
      if (!data.length) {
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = currentProfile?.account_type === "freelancer"
          ? categoryFilter === "All"
            ? "No VIBEs are available yet."
            : `No VIBEs found in ${categoryFilter}.`
          : "No VIBEs yet. Create one above.";
        entries.append(empty);
        return;
      }

      for (const item of data) {
        const article = document.createElement("article");
        article.className = "entry";
        article.tabIndex = 0;
        article.setAttribute("role", "link");
        article.setAttribute("aria-label", `Open VIBE: ${item.project || "Untitled"}`);
        article.addEventListener("click", (event) => {
          if (event.target.closest("button")) return;
          openVibePage(item.id);
        });
        article.addEventListener("keydown", (event) => {
          if (event.target !== article || !["Enter", " "].includes(event.key)) return;
          event.preventDefault();
          openVibePage(item.id);
        });
        const categories = document.createElement("p");
        categories.textContent = `Categories: ${item.categories}`;
        article.append(categories);
        if (currentProfile?.account_type === "freelancer") {
          const name = document.createElement("p");
          name.textContent = `Name: ${item.author_name || "Not set"}`;
          const company = document.createElement("p");
          company.textContent = `Company: ${item.author_company || "Not set"}`;
          article.append(name, company);
        }
        const project = document.createElement("p");
        project.textContent = `Project: ${item.project || "Not set"}`;
        const price = document.createElement("p");
        price.textContent = `Price: $${Number(item.price).toFixed(2)}`;
        const prompt = document.createElement("p");
        const content = document.createElement("div");

        prompt.textContent = `Prompt: ${item.prompt || item.content}`;

        const time = document.createElement("time");
        time.dateTime = item.created_at;
        time.textContent = new Date(item.created_at).toLocaleString();
        article.append(project, prompt);
        if (item.other) {
          const other = document.createElement("p");
          other.textContent = `Other: ${item.other}`;
          article.append(other);
        }
        article.append(price, time);

        if (currentProfile?.account_type === "business") {
          const deleteButton = document.createElement("button");
          deleteButton.className = "secondary";
          deleteButton.type = "button";
          deleteButton.textContent = "Delete";
          deleteButton.setAttribute("aria-label", `Delete VIBE: ${item.project || "Untitled"}`);
          deleteButton.addEventListener("click", async () => {
            if (!supabase || !currentUser) {
              setStatus("Sign in before deleting a VIBE.", "error");
              return;
            }
            if (!window.confirm("Delete this VIBE? This cannot be undone.")) return;

            deleteButton.disabled = true;
            try {
              const { error } = await supabase
                .from("vibes")
                .delete()
                .eq("id", item.id)
                .eq("user_id", currentUser.id);
              if (error) {
                reportError(error);
                return;
              }

              await readTexts();
              setStatus("VIBE deleted.", "success");
            } catch (error) {
              reportError(error);
            } finally {
              deleteButton.disabled = false;
            }
          });
          article.append(deleteButton);
        }
        entries.append(article);
      }
    }

    async function updateSessionView() {
      if (!supabase) return;
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        reportError(error);
        return;
      }

      if (!data.session) {
        await stopChatRealtime();
        showPanel("auth");
        currentUser = null;
        currentProfile = null;
        document.querySelector("#create-vibe-section").hidden = true;
        document.querySelector("#vibe-filter-label").hidden = true;
        document.querySelector("#vibe-category-filter").value = "All";
        document.querySelector("#vibes-list-panel").hidden = false;
        document.querySelector("#vibe-detail").hidden = true;
        const headerUserName = document.querySelector("#header-user-name");
        headerUserName.textContent = "";
        headerUserName.hidden = true;
        headerUserName.setAttribute("aria-expanded", "false");
        document.querySelector("#profile-panel").classList.remove("visible");
        entries.replaceChildren();
        setStatus("Connected. Sign in to continue.", "success");
        return;
      }

      showPanel("data");
      document.querySelector("#signed-in-user").textContent = `Signed in as ${data.session.user.email || "user"}`;
      try {
        currentProfile = await loadProfile(data.session.user);
        document.querySelector("#create-vibe-section").hidden =
          currentProfile.account_type !== "business";
        document.querySelector("#vibe-filter-label").hidden =
          currentProfile.account_type !== "freelancer";
        document.querySelector("#vibe-category-filter").value = "All";
        showProfile(data.session.user, currentProfile);
        const detailPage = Boolean(detailVibeId);
        document.querySelector("#create-vibe-section").hidden =
          detailPage || currentProfile.account_type !== "business";
        document.querySelector("#vibes-list-panel").hidden = detailPage;
        document.querySelector("#vibe-detail").hidden = !detailPage;
        if (detailPage) {
          document.querySelector("#profile-panel").classList.remove("visible");
          document.querySelector("#vibe-detail-heading").textContent = "VIBE details";
          if (!await readVibeDetail()) return;
          await readChatThreads();
          startChatRealtime();
        } else {
          await readTexts();
        }
        setStatus("Connected. Your entries are loaded.", "success");
      } catch (readError) {
        reportError(readError);
      }
    }

    async function connectSupabase() {
      setStatus("Connecting to Supabase...");
      try {
        supabase = createClient(supabaseUrl, supabasePublishableKey);
        await updateSessionView();
      } catch (error) {
        reportError(error);
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase) {
        setStatus("Connect to Supabase first.", "error");
        return;
      }

      const email = document.querySelector("#email").value.trim();
      const passwordInput = document.querySelector("#password");
      try {
        const result = authMode === "register"
          ? await supabase.auth.signUp({
            email,
            password: passwordInput.value,
            options: {
              data: {
                account_type: document.querySelector('input[name="account-type"]:checked').value,
                full_name: document.querySelector("#signup-name").value.trim(),
                company: document.querySelector("#signup-company").value.trim()
              }
            }
          })
          : await supabase.auth.signInWithPassword({ email, password: passwordInput.value });
        passwordInput.value = "";

        if (result.error) {
          reportError(result.error);
          return;
        }

        if (authMode === "register" && !result.data.session) {
          setStatus("Signup received. Check your email for a confirmation link, then sign in.", "success");
          return;
        }

        await updateSessionView();
      } catch (error) {
        passwordInput.value = "";
        reportError(error);
      }
    });

    document.querySelector("#signin-mode").addEventListener("click", () => setAuthMode("signin"));
    document.querySelector("#register-mode").addEventListener("click", () => setAuthMode("register"));
    document.querySelector("#vibe-category-filter").addEventListener("change", async () => {
      try {
        await readTexts();
      } catch (error) {
        reportError(error);
      }
    });

    document.querySelector("#header-user-name").addEventListener("click", (event) => {
      const button = event.currentTarget;
      const profile = document.querySelector("#profile-panel");
      const visible = profile.classList.toggle("visible");
      button.setAttribute("aria-expanded", String(visible));
    });

    document.querySelector("#profile-edit-button").addEventListener("click", () => {
      if (profileEditing) {
        document.querySelector("#profile-form").requestSubmit();
      } else {
        setProfileEditing(true);
        document.querySelector("#profile-name").focus();
      }
    });

    document.querySelector("#profile-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase || !currentUser) {
        setStatus("Sign in before editing your profile.", "error");
        return;
      }

      const button = document.querySelector("#profile-edit-button");
      button.disabled = true;
      try {
        const { data, error } = await supabase
          .from("profile")
          .update({
            full_name: document.querySelector("#profile-name").value.trim(),
            company: document.querySelector("#profile-company").value.trim()
          })
          .eq("id", currentUser.id)
          .select("id, account_type, full_name, company, rating, vip_status")
          .single();
        if (error) {
          reportError(error);
          return;
        }

        currentProfile = data;
        showProfile(currentUser, currentProfile);
        setStatus("Profile saved.", "success");
      } catch (error) {
        reportError(error);
      } finally {
        button.disabled = false;
      }
    });

    textForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (currentProfile?.account_type !== "business") {
        setStatus("Only business accounts can create VIBEs.", "error");
        return;
      }
      const project = document.querySelector("#vibe-project").value.trim();
      const price = Number(document.querySelector("#vibe-price").value);
      const categories = document.querySelector("#vibe-categories").value.trim();
      const prompt = document.querySelector("#vibe-prompt").value.trim();
      const other = document.querySelector("#vibe-other").value.trim();
      if (!project || !prompt || !Number.isFinite(price) || price < 0) return;

      try {
        const { error } = await supabase
          .from("vibes")
          .insert({
            content: prompt,
            project,
            prompt,
            other,
            categories,
            price,
            author_name: currentProfile.full_name || "",
            author_company: currentProfile.company || ""
          });
        if (error) {
          reportError(error);
          return;
        }

        textForm.reset();
        await readTexts();
        setStatus("VIBE created.", "success");
      } catch (error) {
        reportError(error);
      }
    });

    document.querySelector("#refresh-button").addEventListener("click", async () => {
      try {
        await readTexts();
        setStatus("Entries refreshed.", "success");
      } catch (error) {
        reportError(error);
      }
    });

    chatThreadOptions.addEventListener("click", async (event) => {
      const button = event.target.closest(".chat-thread-option");
      if (!button) return;
      activeChatFreelancerId = button.dataset.freelancerId;
      chatThreadSelector.open = false;
      chatControls.disabled = !activeChatFreelancerId;
      try {
        await readChatThreads();
      } catch (error) {
        reportError(error);
      }
    });

    document.querySelector("#sign-out-button").addEventListener("click", async () => {
      try {
        const { error } = await supabase.auth.signOut();
        if (error) {
          reportError(error);
          return;
        }
        await updateSessionView();
      } catch (error) {
        reportError(error);
      }
    });

    connectSupabase();
  </script>
</body>
</html>
