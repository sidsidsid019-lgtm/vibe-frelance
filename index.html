<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supabase Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17211b;
      background: #f3f7f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    h1 { margin: 0 0 8px; }
    p { line-height: 1.5; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .page-header h1 { margin: 0; }
    #header-user-name {
      width: auto;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: right;
      overflow-wrap: anywhere;
    }
    #header-user-name:hover { text-decoration: underline; }

    .card {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #d7e1d9;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 16px #173b2510;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bdcbbf;
      border-radius: 7px;
      font: inherit;
    }

    textarea { min-height: 110px; resize: vertical; }

    button {
      width: auto;
      margin: 10px 8px 0 0;
      border-color: #176b3a;
      background: #176b3a;
      color: white;
      cursor: pointer;
    }

    button.secondary {
      border-color: #bdcbbf;
      background: white;
      color: #17211b;
    }

    button:disabled { cursor: wait; opacity: .6; }

    fieldset { border: 0; padding: 0; margin: 0; }
    .role-options { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 12px 0; }
    .role-options legend { width: 100%; }
    .role-options label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
    .role-options input { width: auto; padding: 0; }
    .auth-modes { display: flex; gap: 8px; }
    .auth-modes button { margin-bottom: 10px; }
    .auth-modes button[aria-pressed="true"] { background: #176b3a; color: white; }
    .account-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .account-row p { margin: 0; }
    .profile { display: none; padding: 12px 0; border-top: 1px solid #e3eae4; }
    .profile.visible { display: block; }
    .profile-heading-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .profile-heading-row h3 { margin: 0; }
    .profile [hidden] { display: none; }
    .profile p { margin: 6px 0; }
    .profile-actions { display: flex; }

    .hint, #status { color: #526257; }
    #status { min-height: 1.5em; }
    #status.error { color: #a52323; }
    #status.success { color: #176b3a; }
    #auth-panel[hidden], #data-panel[hidden] { display: none; }

    .entry {
      padding: 12px 0;
      border-top: 1px solid #e3eae4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .entry time {
      display: block;
      margin-bottom: 6px;
      color: #64736a;
      font-size: .85rem;
    }

    code {
      padding: 2px 5px;
      border-radius: 4px;
      background: #eef3ef;
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>VIBE Freelance</h1>
      <button id="header-user-name" class="hint" type="button" aria-controls="profile-panel" aria-expanded="false" hidden></button>
    </header>

    <section id="auth-panel" class="card" aria-labelledby="auth-heading" hidden>
      <h2 id="auth-heading">Sign in</h2>
      <p class="hint">Sign in or create your freelancer market account.</p>
      <form id="auth-form">
        <div class="auth-modes" aria-label="Account access">
          <button id="signin-mode" class="secondary" type="button" aria-pressed="true">Sign in</button>
          <button id="register-mode" class="secondary" type="button" aria-pressed="false">Register</button>
        </div>
        <fieldset id="signup-fields" hidden disabled>
          <legend>Profile</legend>
          <fieldset class="role-options">
            <legend>Join as</legend>
            <label><input type="radio" name="account-type" value="business" checked> Business</label>
            <label><input type="radio" name="account-type" value="freelancer"> Freelancer</label>
          </fieldset>
          <label for="signup-name">Name</label>
          <input id="signup-name" type="text" autocomplete="name" maxlength="100" required>
          <label for="signup-company">Company</label>
          <input id="signup-company" type="text" autocomplete="organization" maxlength="100" required>
        </fieldset>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <button id="auth-submit" type="submit">Sign in</button>
      </form>
    </section>

    <section id="data-panel" class="card" aria-labelledby="data-heading" hidden>
      <div class="account-row">
        <p id="signed-in-user" class="hint"></p>
        <button id="sign-out-button" class="secondary" type="button">Sign out</button>
      </div>
      <section id="profile-panel" class="profile" aria-labelledby="profile-heading">
        <div class="profile-heading-row">
          <h3 id="profile-heading">Profile</h3>
          <div class="profile-actions">
            <button id="profile-edit-button" type="button">Edit</button>
          </div>
        </div>
        <p><strong>Account type:</strong> <span id="profile-account-type"></span></p>
        <form id="profile-form">
          <p id="profile-name-display-row"><strong>Name:</strong> <span id="profile-name-display"></span></p>
          <label id="profile-name-label" for="profile-name" hidden>Name</label>
          <input id="profile-name" type="text" autocomplete="name" maxlength="100" required disabled hidden>
          <p id="profile-company-display-row"><strong>Company:</strong> <span id="profile-company-display"></span></p>
          <label id="profile-company-label" for="profile-company" hidden>Company</label>
          <input id="profile-company" type="text" autocomplete="organization" maxlength="100" required disabled hidden>
        </form>
        <p><strong>Rating:</strong> <span id="profile-display-rating"></span></p>
        <p><strong>VIP:</strong> <span id="profile-display-vip"></span></p>
      </section>
      <form id="text-form">
        <h3>Create VIBE</h3>
        <label for="vibe-project">Project</label>
        <input id="vibe-project" type="text" maxlength="200" required>
        <label for="vibe-price">Price ($)</label>
        <input id="vibe-price" type="number" min="0" step="0.01" required>
        <label for="vibe-categories">Categories (comma-separated)</label>
        <input id="vibe-categories" type="text" maxlength="500" placeholder="Design, Development, Writing">
        <label for="vibe-prompt">Prompt</label>
        <textarea id="vibe-prompt" maxlength="5000" required placeholder="Describe what you need..."></textarea>
        <label for="vibe-other">Other</label>
        <textarea id="vibe-other" maxlength="5000" placeholder="Additional details (optional)..."></textarea>
        <button type="submit">Create VIBE</button>
        <button id="refresh-button" class="secondary" type="button">Read again</button>
      </form>
      <h3>Your latest entries</h3>
      <div id="entries" aria-live="polite"></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>

  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.118.0";

    const supabaseUrl = "https://mbgtgccebyooktzxuviu.supabase.co";
    const supabasePublishableKey = "sb_publishable_-e035fsg3lFIJqUdcZbWSg_OXxAjZyT";
    const authPanel = document.querySelector("#auth-panel");
    const authForm = document.querySelector("#auth-form");
    const dataPanel = document.querySelector("#data-panel");
    const textForm = document.querySelector("#text-form");
    const entries = document.querySelector("#entries");
    const status = document.querySelector("#status");
    let supabase = null;
    let authMode = "signin";
    let currentUser = null;
    let currentProfile = null;
    let profileEditing = false;

    function setStatus(message, kind = "") {
      status.textContent = message;
      status.className = kind;
    }

    function showPanel(panel) {
      authPanel.hidden = panel !== "auth";
      dataPanel.hidden = panel !== "data";
    }

    function reportError(error) {
      setStatus(error?.message || "The request failed. Check the project URL, key, table setup, and RLS policies.", "error");
    }

    function setAuthMode(mode) {
      authMode = mode;
      const registering = mode === "register";
      document.querySelector("#auth-heading").textContent = registering ? "Create account" : "Sign in";
      const signupFields = document.querySelector("#signup-fields");
      signupFields.hidden = !registering;
      signupFields.disabled = !registering;
      document.querySelector("#auth-submit").textContent = registering ? "Register" : "Sign in";
      document.querySelector("#signin-mode").setAttribute("aria-pressed", String(!registering));
      document.querySelector("#register-mode").setAttribute("aria-pressed", String(registering));
      document.querySelector("#password").autocomplete = registering ? "new-password" : "current-password";
    }

    function showProfile(user, profile) {
      currentUser = user;
      const headerUserName = document.querySelector("#header-user-name");
      headerUserName.textContent = profile.full_name || "";
      headerUserName.hidden = !profile.full_name;
      document.querySelector("#profile-account-type").textContent =
        profile.account_type === "freelancer" ? "Freelancer" : "Business";
      document.querySelector("#profile-name").value = profile.full_name || "";
      document.querySelector("#profile-company").value = profile.company || "";
      document.querySelector("#profile-name-display").textContent = profile.full_name || "Not set";
      document.querySelector("#profile-company-display").textContent = profile.company || "Not set";
      document.querySelector("#profile-display-rating").textContent =
        Number.isInteger(profile.rating) && profile.rating >= 1 && profile.rating <= 10 ? `${profile.rating}/10` : "Not rated";
      document.querySelector("#profile-display-vip").textContent = profile.vip_status === true ? "Yes" : "No";
      setProfileEditing(false);
    }

    async function loadProfile(user) {
      const profileFields = "id, account_type, full_name, company, rating, vip_status";
      const { data, error } = await supabase
        .from("profile")
        .select(profileFields)
        .eq("id", user.id)
        .maybeSingle();

      if (error) throw error;
      if (data) return data;

      const metadata = user.user_metadata || {};
      const accountType = ["business", "freelancer"].includes(metadata.account_type)
        ? metadata.account_type
        : "business";
      const { data: createdProfile, error: insertError } = await supabase
        .from("profile")
        .insert({
          id: user.id,
          account_type: accountType,
          full_name: metadata.full_name || "",
          company: metadata.company || ""
        })
        .select(profileFields)
        .single();

      if (!insertError) return createdProfile;

      const { data: existingProfile, error: retryError } = await supabase
        .from("profile")
        .select(profileFields)
        .eq("id", user.id)
        .maybeSingle();

      if (!retryError && existingProfile) return existingProfile;
      throw insertError;
    }

    function setProfileEditing(editing) {
      profileEditing = editing;
      document.querySelector("#profile-name").disabled = !editing;
      document.querySelector("#profile-company").disabled = !editing;
      document.querySelector("#profile-name").hidden = !editing;
      document.querySelector("#profile-company").hidden = !editing;
      document.querySelector("#profile-name-label").hidden = !editing;
      document.querySelector("#profile-company-label").hidden = !editing;
      document.querySelector("#profile-name-display-row").hidden = editing;
      document.querySelector("#profile-company-display-row").hidden = editing;
      const button = document.querySelector("#profile-edit-button");
      button.textContent = editing ? "Save" : "Edit";
    }

    async function readTexts() {
      if (!supabase) return;
      const { data, error } = await supabase
        .from("vibes")
        .select("id, content, project, prompt, other, categories, price, created_at")
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) throw error;

      entries.replaceChildren();
      if (!data.length) {
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "No VIBEs yet. Create one above.";
        entries.append(empty);
        return;
      }

      for (const item of data) {
        const article = document.createElement("article");
        article.className = "entry";
        const time = document.createElement("time");
        time.dateTime = item.created_at;
        time.textContent = new Date(item.created_at).toLocaleString();
        const content = document.createElement("div");
        const project = document.createElement("p");
        project.textContent = `Project: ${item.project || "Not set"}`;
        const price = document.createElement("p");
        price.textContent = `Price: $${Number(item.price).toFixed(2)}`;
        const prompt = document.createElement("p");
        prompt.textContent = `Prompt: ${item.prompt || item.content}`;
        article.append(time, project, price, prompt);
        if (item.categories) {
          const categories = document.createElement("p");
          categories.textContent = `Categories: ${item.categories}`;
          article.append(categories);
        }
        if (item.other) {
          const other = document.createElement("p");
          other.textContent = `Other: ${item.other}`;
          article.append(other);
        }
        entries.append(article);
      }
    }

    async function updateSessionView() {
      if (!supabase) return;
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        reportError(error);
        return;
      }

      if (!data.session) {
        showPanel("auth");
        currentUser = null;
        currentProfile = null;
        const headerUserName = document.querySelector("#header-user-name");
        headerUserName.textContent = "";
        headerUserName.hidden = true;
        headerUserName.setAttribute("aria-expanded", "false");
        document.querySelector("#profile-panel").classList.remove("visible");
        entries.replaceChildren();
        setStatus("Connected. Sign in to continue.", "success");
        return;
      }

      showPanel("data");
      document.querySelector("#signed-in-user").textContent = `Signed in as ${data.session.user.email || "user"}`;
      try {
        currentProfile = await loadProfile(data.session.user);
        showProfile(data.session.user, currentProfile);
        await readTexts();
        setStatus("Connected. Your entries are loaded.", "success");
      } catch (readError) {
        reportError(readError);
      }
    }

    async function connectSupabase() {
      setStatus("Connecting to Supabase...");
      try {
        supabase = createClient(supabaseUrl, supabasePublishableKey);
        await updateSessionView();
      } catch (error) {
        reportError(error);
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase) {
        setStatus("Connect to Supabase first.", "error");
        return;
      }

      const email = document.querySelector("#email").value.trim();
      const passwordInput = document.querySelector("#password");
      try {
        const result = authMode === "register"
          ? await supabase.auth.signUp({
            email,
            password: passwordInput.value,
            options: {
              data: {
                account_type: document.querySelector('input[name="account-type"]:checked').value,
                full_name: document.querySelector("#signup-name").value.trim(),
                company: document.querySelector("#signup-company").value.trim()
              }
            }
          })
          : await supabase.auth.signInWithPassword({ email, password: passwordInput.value });
        passwordInput.value = "";

        if (result.error) {
          reportError(result.error);
          return;
        }

        if (authMode === "register" && !result.data.session) {
          setStatus("Signup received. Check your email for a confirmation link, then sign in.", "success");
          return;
        }

        await updateSessionView();
      } catch (error) {
        passwordInput.value = "";
        reportError(error);
      }
    });

    document.querySelector("#signin-mode").addEventListener("click", () => setAuthMode("signin"));
    document.querySelector("#register-mode").addEventListener("click", () => setAuthMode("register"));

    document.querySelector("#header-user-name").addEventListener("click", (event) => {
      const button = event.currentTarget;
      const profile = document.querySelector("#profile-panel");
      const visible = profile.classList.toggle("visible");
      button.setAttribute("aria-expanded", String(visible));
    });

    document.querySelector("#profile-edit-button").addEventListener("click", () => {
      if (profileEditing) {
        document.querySelector("#profile-form").requestSubmit();
      } else {
        setProfileEditing(true);
        document.querySelector("#profile-name").focus();
      }
    });

    document.querySelector("#profile-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase || !currentUser) {
        setStatus("Sign in before editing your profile.", "error");
        return;
      }

      const button = document.querySelector("#profile-edit-button");
      button.disabled = true;
      try {
        const { data, error } = await supabase
          .from("profile")
          .update({
            full_name: document.querySelector("#profile-name").value.trim(),
            company: document.querySelector("#profile-company").value.trim()
          })
          .eq("id", currentUser.id)
          .select("id, account_type, full_name, company, rating, vip_status")
          .single();
        if (error) {
          reportError(error);
          return;
        }

        currentProfile = data;
        showProfile(currentUser, currentProfile);
        setStatus("Profile saved.", "success");
      } catch (error) {
        reportError(error);
      } finally {
        button.disabled = false;
      }
    });

    textForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const project = document.querySelector("#vibe-project").value.trim();
      const price = Number(document.querySelector("#vibe-price").value);
      const categories = document.querySelector("#vibe-categories").value.trim();
      const prompt = document.querySelector("#vibe-prompt").value.trim();
      const other = document.querySelector("#vibe-other").value.trim();
      if (!project || !prompt || !Number.isFinite(price) || price < 0) return;

      try {
        const { error } = await supabase
          .from("vibes")
          .insert({ content: prompt, project, prompt, other, categories, price });
        if (error) {
          reportError(error);
          return;
        }

        textForm.reset();
        await readTexts();
        setStatus("VIBE created.", "success");
      } catch (error) {
        reportError(error);
      }
    });

    document.querySelector("#refresh-button").addEventListener("click", async () => {
      try {
        await readTexts();
        setStatus("Entries refreshed.", "success");
      } catch (error) {
        reportError(error);
      }
    });

    document.querySelector("#sign-out-button").addEventListener("click", async () => {
      try {
        const { error } = await supabase.auth.signOut();
        if (error) {
          reportError(error);
          return;
        }
        await updateSessionView();
      } catch (error) {
        reportError(error);
      }
    });

    connectSupabase();
  </script>
</body>
</html>
